name: Build EA7300v2

on: [workflow_dispatch]

permissions: write-all

env:
  BUILD_TARGET: 24.10.5
  GCCVER: 13.3.0
  LLVMBPFVER: 18.1.7

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@main
    
    - name: Initialize environment
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        sudo apt update 
        sudo apt install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev \
        file wget

    - name: Install toolchain
      run: |
        cd $GITHUB_WORKSPACE
        wget https://downloads.openwrt.org/releases/$BUILD_TARGET/targets/ramips/mt7621/config.buildinfo -O .config
        echo "CONFIG_TARGET_ramips_mt7621_DEVICE_linksys_ea7300-v2=y" >> .config
        wget https://github.com/trinidude4/openwrt/releases/download/EA7300v2-toolchain-latest/toolchain.tar.xz
        tar -xhf toolchain.tar.xz
        ./scripts/ext-toolchain.sh --toolchain staging_dir/toolchain-mipsel_24kc_gcc-${{ env.GCCVER }}_musl --overwrite-config --config ramips/mt7621
        wget https://github.com/trinidude4/openwrt/releases/download/EA7300v2-sdk-latest/sdk.tar.xz
        tar -xhf sdk.tar.xz
        wget https://downloads.openwrt.org/releases/$BUILD_TARGET/targets/ramips/mt7621/llvm-bpf-${{ env.LLVMBPFVER }}.Linux-x86_64.tar.zst
        tar --zstd -xf llvm*.tar.zst
        echo "CONFIG_USE_LLVM_PREBUILT=y" >> .config
        
    - name: Update feeds
      run: cd $GITHUB_WORKSPACE && ./scripts/feeds update -a
      
    - name: Install feeds
      run: cd $GITHUB_WORKSPACE && ./scripts/feeds install -a
        
    - name: Build Image
      run: |
        cd $GITHUB_WORKSPACE
        echo "CONFIG_PACKAGE_luci-app-advanced-reboot=y" >> .config
        make defconfig
        make -j$(nproc)
    - name: Upload directories
      uses: actions/upload-artifact@main
      with:
        name: build_upload
        path: |
          bin

    - name: Upload files
      uses: maggie44/actions/packages/automatic-releases@built-packages
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: EA7300v2-${{ env.BUILD_TARGET }}
        prerelease: false
        title: EA7300v2 ${{ env.BUILD_TARGET }}
        files: |
          bin/targets/ramips/mt7621/*.bin
